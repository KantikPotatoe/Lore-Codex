name: Release

# Builds the Windows installer and attaches it to a GitHub Release whenever a
# version tag lands. Tags are pushed by version-bump.yml using BUMP_PAT — a
# PAT-pushed tag DOES trigger workflows (a GITHUB_TOKEN-pushed one would not).
# Updater manifests are signed with TAURI_SIGNING_PRIVATE_KEY; without that
# secret set, a tagged build FAILS rather than silently shipping an unsigned,
# unusable manifest (bundle.createUpdaterArtifacts is on).
# Unsigned on purpose: personal tool; SmartScreen's "More info → Run anyway"
# on first run is the accepted cost (see docs/desktop-transition-investigation.md §6).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Runs beforeBuildCommand (tsc -b && vite build), compiles the shell,
      # bundles the NSIS installer, signs an updater manifest (latest.json),
      # and uploads both to a release for the tag.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lore Codex ${{ github.ref_name }}'
          # Also the fallback body: if the changelog step below fails, the
          # release still explains itself instead of showing an empty page.
          releaseBody: 'Windows installer for Lore Codex ${{ github.ref_name }}. Unsigned — SmartScreen will ask for "More info → Run anyway" on first launch.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # tauri-action publishes with an explicit body, and an explicit body
      # suppresses GitHub's own note generation — so the changelog has to be
      # generated and written back afterwards. `generate-notes` picks the
      # previous tag itself and groups PRs per .github/release.yml.
      #
      # Deliberately NOT continue-on-error: the installer and updater manifest
      # are already published by this point, so a failure here costs only the
      # notes (the fallback body above stands), but it must still show red
      # rather than quietly shipping a release that says nothing about itself.
      - name: Write the changelog into the release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body)
          {
            printf 'Windows installer for Lore Codex %s. Unsigned — SmartScreen will ask for "More info → Run anyway" on first launch.\n\n' "${GITHUB_REF_NAME}"
            printf '%s\n' "$notes"
          } > release-notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
