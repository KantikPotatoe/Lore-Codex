name: Desktop

# Compile-checks the Tauri shell (src-tauri) so a PR can't silently break the
# desktop build — the main CI only exercises the web target. `cargo check`
# (not a full bundle) keeps feedback fast; the real installer is built locally
# / by a future release workflow. Scoped by paths: pure web changes skip it.
#
# The frontend build must run first: tauri's generate_context! macro embeds
# ../dist at compile time, so `cargo check` fails without it.
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (embedded by generate_context!)
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check the shell crate
        run: cargo check --manifest-path src-tauri/Cargo.toml
