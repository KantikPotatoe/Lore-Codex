name: Version Bump

# When a PR is merged into main, bump the version in package.json according to
# the PR's label (version:major / version:minor / version:patch, defaulting to
# patch), commit the change back to main, and push a matching git tag.
on:
  pull_request:
    types: [closed]

# Needs write access to push the bump commit and tag back to the repo.
permissions:
  contents: write

jobs:
  bump:
    # Only run for PRs that were actually merged into main (not just closed).
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          # Full history so the tag lands on a real commit, not a shallow stub.
          fetch-depth: 0
          # An admin PAT (not the default GITHUB_TOKEN) is required to push to
          # main: the "main protection" ruleset requires a PR + the "verify"
          # check, which the default token can neither satisfy nor bypass. The
          # Admin role is an "always" bypass on that ruleset, so this token
          # clears both. That bypass is load-bearing — narrowing it to
          # "pull_request" mode breaks this push and therefore the release tag.
          # This workflow only triggers on PR close, so the push it makes below
          # cannot re-trigger it: there is no bump-on-bump loop.
          token: ${{ secrets.BUMP_PAT }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Determine bump level from PR labels
        id: level
        env:
          # Comma-separated list of the merged PR's label names.
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Split on commas so we can match a label name exactly.
          if echo "$LABELS" | tr ',' '\n' | grep -qx 'version:major'; then
            level=major
          elif echo "$LABELS" | tr ',' '\n' | grep -qx 'version:minor'; then
            level=minor
          else
            # version:patch or no version label -> patch.
            level=patch
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "Bump level: $level"

      - name: Bump version
        id: bump
        run: |
          # --no-git-tag-version: update files only; we commit + tag by hand
          # below so we control the message and can add [skip ci].
          new_version="$(npm version "${{ steps.level.outputs.level }}" --no-git-tag-version)"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "New version: $new_version"

      # The bump commit must NOT carry a [skip ci] marker. The tag below points at
      # that commit, and GitHub reads skip instructions from the head commit of
      # *any* push — including a tag push. A [skip ci] here therefore suppressed
      # the tag event that release.yml listens on, so the installer never built.
      # The price of leaving it off is one redundant CI run on the bump push.
      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${VERSION}"
          git tag -a "${VERSION}" -m "${VERSION}"
          git push origin main
          git push origin "${VERSION}"
