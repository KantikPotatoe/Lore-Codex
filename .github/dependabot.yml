version: 2

# Without this file Dependabot only raises *security* alerts, and nothing opens
# a PR until something is already vulnerable. That is how the repo drifted five
# weeks with two high-severity runtime alerts behind a single stale postcss PR.
# Scheduled version updates keep the lockfile close to upstream so a security
# bump is a one-line refresh instead of a catch-up.
#
# Every entry carries `version:patch`, because version-bump.yml reads the PR
# label to decide the release bump and no label silently means patch anyway.
# Stating it keeps dependency PRs consistent with the "always label" rule.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - version:patch
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    ignore:
      # TypeScript 7 (the Go-native compiler) is outside every published
      # typescript-eslint peer range — 8.69.0, the newest release, still caps at
      # `typescript@">=4.8.4 <6.1.0"`. A TS 7 bump therefore can't install at
      # all: `npm ci` dies on ERESOLVE and `verify` fails before lint/build/test
      # start (that was #259). No combination of versions fixes it from our
      # side, so the bump is blocked until typescript-eslint ships TS 7 support
      # — then delete this entry, don't widen it.
      #
      # Scoped to majors on purpose: patches and minors inside the supported
      # line still flow. The cost is that a *major-version* security bump for
      # typescript would also be suppressed; acceptable for a dev-only compiler
      # that never ships to users, and cheap to revisit by removing this block.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # One PR for the routine noise. Majors are deliberately excluded so a
      # breaking bump arrives alone and reviewable, never bundled with ten
      # harmless patches.
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Security fixes travel together and land as one PR regardless of range.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The desktop shell has a tracked Cargo.lock, so it drifts the same way the
  # npm side did. desktop.yml's cargo-check is path-scoped to src-tauri/**, so
  # these PRs get compiled; pure-web PRs still never wait on it.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - version:patch
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - version:patch
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
