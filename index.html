<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts are self-hosted via @fontsource imports in src/main.tsx so the
         app works offline and inside the desktop shell's CSP (no CDN). -->
    <title>Lore Codex</title>
    <!-- Paint the app's dark base immediately so a full reload (e.g. switching
         worlds, which rebinds the per-lore DB) doesn't flash white before the
         stylesheet loads. Mirrors --bg in src/index.css. -->
    <style>
      :root { color-scheme: dark; }
      html, body { background: #15130f; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
