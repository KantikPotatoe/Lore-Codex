[package]
name = "lore-codex"
# Cargo needs a literal version; the bundler's version comes from
# tauri.conf.json, which points at ../package.json (single source of truth,
# bumped by version-bump.yml). This field is not user-visible.
version = "0.1.0"
description = "Lore Codex — a local-first worldbuilding wiki"
authors = ["KantikPotatoe"]
license = ""
repository = "https://github.com/KantikPotatoe/Lore-Codex"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
